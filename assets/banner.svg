<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">dotfiles-windows</title>
  <desc id="d">A tiled Windows desktop: a terminal running setup.ps1 on the left, Neovim and a browser stacked on the right, with the komorebi bar on top.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#11111b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glow)"/>

  <!-- Left: title, tagline, tool chips, command -->
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="64" y="104" fill="#89b4fa" font-size="15" font-weight="600" letter-spacing="3">WINDOWS DEV SETUP</text>
    <text x="62" y="166" fill="#cdd6f4" font-size="56" font-weight="700">dotfiles-windows</text>
    <text x="64" y="206" fill="#a6adc8" font-size="21">One script → a fast, tiled, ready-to-code Windows.</text>

    <g font-size="15" font-weight="600" text-anchor="middle">
      <rect x="64"  y="236" width="96"  height="30" rx="15" fill="#313244"/><text x="112" y="256" fill="#cba6f7">komorebi</text>
      <rect x="170" y="236" width="64"  height="30" rx="15" fill="#313244"/><text x="202" y="256" fill="#89b4fa">whkd</text>
      <rect x="244" y="236" width="72"  height="30" rx="15" fill="#313244"/><text x="280" y="256" fill="#94e2d5">hover</text>
      <rect x="326" y="236" width="90"  height="30" rx="15" fill="#313244"/><text x="371" y="256" fill="#f5c2e7">WezTerm</text>
      <rect x="64"  y="276" width="128" height="30" rx="15" fill="#313244"/><text x="128" y="296" fill="#89dceb">PowerShell 7</text>
      <rect x="202" y="276" width="82"  height="30" rx="15" fill="#313244"/><text x="243" y="296" fill="#a6e3a1">Neovim</text>
      <rect x="294" y="276" width="72"  height="30" rx="15" fill="#313244"/><text x="330" y="296" fill="#fab387">Herdr</text>
      <rect x="376" y="276" width="122" height="30" rx="15" fill="#313244"/><text x="437" y="296" fill="#f9e2af">Claude Code</text>
    </g>

    <g font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="17">
      <rect x="64" y="332" width="380" height="40" rx="10" fill="#181825" stroke="#313244"/>
      <text x="82" y="358" fill="#a6e3a1">❯</text>
      <text x="104" y="358" fill="#cdd6f4">.\setup.ps1</text>
      <text x="238" y="358" fill="#6c7086"># pick steps, done</text>
    </g>
  </g>

  <!-- Right: monitor with a komorebi-tiled desktop -->
  <g>
    <rect x="652" y="48" width="496" height="306" rx="16" fill="#11111b" stroke="#45475a" stroke-width="2"/>
    <rect x="860" y="354" width="80" height="20" fill="#313244"/>
    <rect x="812" y="372" width="176" height="10" rx="5" fill="#45475a"/>

    <!-- komorebi bar -->
    <rect x="668" y="62" width="464" height="28" rx="7" fill="#181825"/>
    <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
      <rect x="676" y="67" width="20" height="18" rx="5" fill="#89b4fa"/><text x="686" y="80" fill="#11111b">1</text>
      <text x="710" y="80" fill="#6c7086">2</text>
      <text x="730" y="80" fill="#6c7086">3</text>
      <text x="750" y="80" fill="#6c7086">4</text>
      <text x="770" y="80" fill="#6c7086">5</text>
      <text x="1105" y="80" fill="#a6adc8" font-weight="600">13:10</text>
    </g>
    <circle cx="1060" cy="76" r="4" fill="#a6e3a1"/>
    <circle cx="1074" cy="76" r="4" fill="#f9e2af"/>

    <!-- Terminal tile (focused: komorebi border) -->
    <rect x="668" y="100" width="226" height="240" rx="8" fill="#1e1e2e" stroke="#89b4fa" stroke-width="3"/>
    <rect x="670" y="102" width="222" height="20" rx="6" fill="#181825"/>
    <circle cx="682" cy="112" r="3.5" fill="#f38ba8"/><circle cx="694" cy="112" r="3.5" fill="#f9e2af"/><circle cx="706" cy="112" r="3.5" fill="#a6e3a1"/>
    <g font-family="'Cascadia Code', Consolas, monospace" font-size="11.5" xml:space="preserve">
      <text x="680" y="144"><tspan fill="#a6e3a1">❯</tspan><tspan fill="#cdd6f4"> .\setup.ps1 -All</tspan></text>
      <text x="680" y="166" fill="#89b4fa">==&gt; 1. Packages</text>
      <text x="680" y="184" fill="#89b4fa">==&gt; 5. komorebi</text>
      <text x="680" y="202" fill="#89b4fa">==&gt; 9. Speed fixes</text>
      <text x="680" y="228" fill="#a6adc8">Step          Result</text>
      <text x="680" y="246" fill="#cdd6f4">1. Packages   <tspan fill="#a6e3a1">OK</tspan></text>
      <text x="680" y="264" fill="#cdd6f4">5. komorebi   <tspan fill="#a6e3a1">OK</tspan></text>
      <text x="680" y="282" fill="#cdd6f4">9. Speed      <tspan fill="#a6e3a1">OK</tspan></text>
      <text x="680" y="314"><tspan fill="#a6e3a1">❯</tspan><tspan fill="#cdd6f4"> claude</tspan></text>
      <rect x="738" y="304" width="7" height="13" fill="#cdd6f4"/>
    </g>

    <!-- Neovim tile -->
    <rect x="902" y="100" width="230" height="116" rx="8" fill="#1e1e2e" stroke="#313244" stroke-width="2"/>
    <g font-family="'Cascadia Code', Consolas, monospace" font-size="10" fill="#585b70">
      <text x="912" y="122">1</text><text x="912" y="138">2</text><text x="912" y="154">3</text>
      <text x="912" y="170">4</text><text x="912" y="186">5</text><text x="912" y="202">6</text>
    </g>
    <rect x="930" y="114" width="40" height="8" rx="3" fill="#cba6f7"/><rect x="976" y="114" width="70" height="8" rx="3" fill="#89b4fa"/>
    <rect x="942" y="130" width="56" height="8" rx="3" fill="#f38ba8"/><rect x="1004" y="130" width="90" height="8" rx="3" fill="#a6e3a1"/>
    <rect x="942" y="146" width="104" height="8" rx="3" fill="#89dceb"/>
    <rect x="954" y="162" width="64" height="8" rx="3" fill="#fab387"/><rect x="1024" y="162" width="46" height="8" rx="3" fill="#cdd6f4"/>
    <rect x="942" y="178" width="30" height="8" rx="3" fill="#cba6f7"/>
    <rect x="930" y="194" width="14" height="8" rx="3" fill="#cdd6f4"/>
    <rect x="904" y="204" width="226" height="10" rx="3" fill="#313244"/>
    <rect x="904" y="204" width="46" height="10" rx="3" fill="#a6e3a1"/>

    <!-- Browser tile -->
    <rect x="902" y="224" width="230" height="116" rx="8" fill="#1e1e2e" stroke="#313244" stroke-width="2"/>
    <rect x="912" y="234" width="210" height="16" rx="8" fill="#313244"/>
    <circle cx="922" cy="242" r="3.5" fill="#6c7086"/>
    <rect x="912" y="260" width="120" height="10" rx="3" fill="#cdd6f4"/>
    <rect x="912" y="278" width="210" height="6" rx="3" fill="#45475a"/>
    <rect x="912" y="290" width="180" height="6" rx="3" fill="#45475a"/>
    <rect x="912" y="306" width="64" height="24" rx="6" fill="#89b4fa" fill-opacity="0.85"/>
    <rect x="984" y="306" width="64" height="24" rx="6" fill="#313244"/>
  </g>
</svg>
